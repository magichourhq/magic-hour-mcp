name: Sync OpenAPI

on:
  schedule:
    # Run daily at 12:00 AM PST / 1:00 AM PDT (08:00 UTC).
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-openapi
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install -e .

      - name: Fetch OpenAPI spec
        run: |
          curl --fail --silent --show-error --location \
            https://magichour.ai/docs/api/openapi.json \
            --output /tmp/magic-hour-openapi.json
          python -m json.tool /tmp/magic-hour-openapi.json >/dev/null
          mv /tmp/magic-hour-openapi.json docs/openapi.json

      - name: Regenerate API reference
        run: python docs/build_reference.py

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_openapi*.py"

      - name: Commit updated spec
        run: |
          if git diff --quiet -- docs/openapi.json docs/api-reference.md; then
            echo "OpenAPI spec already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/openapi.json docs/api-reference.md
          git commit -m "chore: sync OpenAPI spec"
          git push origin "HEAD:${GITHUB_REF_NAME}"
